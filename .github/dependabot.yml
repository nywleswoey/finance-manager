# Automated dependency updates. Three surfaces, three schedules — see .github/workflows/ci.yml
# for what runs on the PRs this opens, and dependabot-automerge.yml for which of them merge
# without a human.
#
# Grouping is the whole point of the config below. Ungrouped, this repo opens ~10 PRs a week
# (react + react-dom, sqlalchemy + psycopg, every @playwright/* in lockstep) and each one runs
# the full 1367-assertion viewport suite. Grouped, related bumps arrive as one PR that either
# passes together or fails together, which is also how they would be deployed.
version: 2

updates:
  # ---------------------------------------------------------------------------
  # Python — pyproject.toml + uv.lock + requirements.txt, all three in one PR
  #
  # `uv` names the RESOLVER, not the file set: dependabot's python updater rewrites every
  # manifest in the directory it can, requirements.txt included. Measured, not assumed —
  # PR #70 carried fastapi 0.138.0 -> 0.141.1 into the lockfile and the runtime pins
  # together, and CI's drift check passed on it.
  #
  # (This comment used to claim the opposite, that the lockfile moved alone and every
  # production bump needed `make sync-requirements` committed onto the PR by hand. It was
  # written before any dependabot PR existed to check it against. It was wrong.)
  #
  # So `sync_requirements --check` in CI is an invariant, not a chore anyone performs. What
  # it actually guards is a hand-run `uv lock` — which is how the lockfile came to have no
  # entry for anthropic at all while requirements.txt pinned it.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Singapore"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # First, for the same reason as the react group below: `update-types` groups drop
      # majors, and alembic reads enough SQLAlchemy internals that a SQLAlchemy major
      # arriving without the alembic that supports it breaks `make migrate` — with the two
      # in separate PRs, neither is mergeable and CI cannot tell you why.
      sqlalchemy:
        patterns: ["sqlalchemy", "alembic"]
      # ruff + pytest: never shipped, and a bump that breaks them breaks CI loudly and
      # locally-fixably. These are the ones automerge is allowed to take.
      python-dev:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      # The runtime stack moves together or not at all — sqlalchemy and psycopg are one
      # decision, fastapi and pydantic are another, and reviewing them apart invites the
      # combination nobody tested.
      python-runtime:
        dependency-type: "production"
        update-types: ["minor", "patch"]

  # ---------------------------------------------------------------------------
  # Frontend — web/package.json + web/package-lock.json
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Singapore"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # ORDER MATTERS: a dependency joins the FIRST group it matches, so the two pattern
      # groups below must precede the update-type ones.
      #
      # These two exist because `update-types` groups silently exclude majors — anything not
      # minor/patch falls out and gets its own PR. For a coupled pair that is not noise, it
      # is a deadlock: dependabot's first run opened react 18->19 (#67) and react-dom 18->19
      # (#69) as SEPARATE PRs, and neither can be merged alone, so both are stuck forever.
      # Matching on name instead of update-type is what keeps a major together.
      #
      # Patterns are exact unless they contain a wildcard, so "react" does not match
      # "react-dom" — both are listed. @types/react* is here for the day this repo grows
      # TypeScript; it matches nothing today and costs nothing.
      react:
        patterns: ["react", "react-dom", "@types/react*"]
      # Same failure mode, same fix: @vitejs/plugin-react declares a peer range on vite, so
      # a vite major essentially always needs the plugin major with it.
      vite:
        patterns: ["vite", "@vitejs/plugin-react"]
      # What is left of the dev set — @playwright/test, which pairs with nothing. The
      # viewport suite tests the toolchain directly: it runs against the production build
      # through vite's preview server, so a bump that changes CSS ordering fails here.
      web-dev:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      # recharts and posthog-js: the only runtime deps left once react is grouped above, and
      # a weekly PR each is noise. Majors still arrive alone, which is correct — neither is
      # coupled to anything, and recharts 2->3 is a changelog to read.
      web-runtime:
        dependency-type: "production"
        update-types: ["minor", "patch"]

  # ---------------------------------------------------------------------------
  # The workflows themselves. Actions are pinned to major tags (@v5), so this mostly catches
  # the major bumps that tag-pinning cannot follow — rare, and always worth reading.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
