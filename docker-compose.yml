# Pinned (not a typo): the existing portfolio_db container/volume were created when the checkout
# folder was named "portofolio". Without this, any other folder name derives a different project
# and `up` fails with "container name /portfolio_db already in use". COMPOSE_PROJECT_NAME still wins.
name: portofolio

services:
  db:
    image: postgres:16-alpine
    container_name: portfolio_db
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    ports:
      - "5544:5432"          # 5544 on host to avoid clashing with a local pg
    volumes:
      - portfolio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  portfolio_pgdata:
