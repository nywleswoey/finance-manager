[project]
name = "portfolio-platform"
version = "0.1.0"
description = "Personal portfolio platform — DB-backed ledger, performance, ingestion"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "google-auth>=2.0",
    "requests>=2.31",
    "pyjwt>=2.8",
    "pyyaml>=6.0.3",
    "anthropic>=0.120",
]

[tool.uv]
package = false

# Vercel deploys this as a FastAPI app (single Vercel Function serving all routes).
# Vercel detects the entrypoint at api/index.py (re-exports server.main:app) and
# installs deps from pyproject/uv.lock. This build hook runs after deps install and
# before deploy: build the React SPA into web/dist so FastAPI's StaticFiles mount
# serves it (same-origin -> first-party session cookie).
[tool.vercel.scripts]
build = "npm --prefix web ci && npm --prefix web run build"

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8"]

[tool.pytest.ini_options]
# `pg` marks the tests that need a real Postgres (tests/*_pg.py, via tests/pgtest.py) because
# the SQL they cover is Postgres-only — `to_char` month bucketing has no SQLite equivalent.
# They skip themselves when no server answers, so the default run is unaffected whether or not
# `make db-up` has been run; `-m "not pg"` deselects them outright.
markers = ["pg: needs a reachable Postgres (make db-up); skips when there is none"]

[tool.ruff]
# Alembic migrations are applied historical artifacts (autogenerated boilerplate); don't lint them.
extend-exclude = ["migrations"]

[tool.ruff.lint]
# Pin the E4/E7/E9/F ruleset explicitly (F-codes — undefined names, unused imports — are the
# high-value correctness checks). This must be spelled out rather than left to ruff's default
# `select`: newer ruff versions resolve a much wider default (SIM/I/C4/PLR/FURB/DTZ/BLE…), which
# floods the compact style this codebase deliberately uses. Explicit select freezes the ruleset
# across ruff upgrades.
select = ["E4", "E7", "E9", "F"]
# Minus the compound-statement / import-layout style rules this codebase intentionally violates
# for its compact aesthetic:
#   E401 — multiple imports on one line   (build/ parser scripts)
#   E402 — module import not at top: handlers use lazy `from ...` imports to break import cycles.
#   E701 — multiple statements on a line (colon): columnar-aligned branches in build/ parsers.
#   E702 — multiple statements on a line (semicolon): `a; b` one-liners are a deliberate style.
#   E731 — lambda assignment: used for small local callables.
ignore = ["E401", "E402", "E701", "E702", "E731"]
