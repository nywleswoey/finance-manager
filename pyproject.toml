[project]
name = "portfolio-platform"
version = "0.1.0"
description = "Personal portfolio platform — DB-backed ledger, performance, ingestion"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "google-auth>=2.0",
    "requests>=2.31",
    "pyjwt>=2.8",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

# Vercel deploys this as a FastAPI app (single Vercel Function serving all routes).
# Vercel detects the entrypoint at api/index.py (re-exports server.main:app) and
# installs deps from pyproject/uv.lock. This build hook runs after deps install and
# before deploy: build the React SPA into web/dist so FastAPI's StaticFiles mount
# serves it (same-origin -> first-party session cookie).
[tool.vercel.scripts]
build = "npm --prefix web ci && npm --prefix web run build"

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[tool.ruff]
# Alembic migrations are applied historical artifacts (autogenerated boilerplate); don't lint them.
extend-exclude = ["migrations"]

[tool.ruff.lint]
# Keep the default E4/E7/E9/F ruleset (F-codes — undefined names, unused imports — are the
# high-value correctness checks), minus the compound-statement / import-layout style rules this
# codebase intentionally violates for its compact aesthetic:
#   E401 — multiple imports on one line   (build/ parser scripts)
#   E402 — module import not at top: handlers use lazy `from ...` imports to break import cycles.
#   E701 — multiple statements on a line (colon): columnar-aligned branches in build/ parsers.
#   E702 — multiple statements on a line (semicolon): `a; b` one-liners are a deliberate style.
#   E731 — lambda assignment: used for small local callables.
ignore = ["E401", "E402", "E701", "E702", "E731"]
