[project]
name = "portfolio-platform"
version = "0.1.0"
description = "Personal portfolio platform — DB-backed ledger, performance, ingestion"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "google-auth>=2.0",
    "requests>=2.31",
    "pyjwt>=2.8",
]

[tool.uv]
package = false

[project.optional-dependencies]
dev = ["ruff>=0.6"]
